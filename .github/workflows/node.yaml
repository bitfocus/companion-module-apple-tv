name: Validation

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, and metadata oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build and check types
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Check recorded pyatv metadata packets against the Node codec and state reader
        run: node experiments/node-library/metadata-oracle.mjs < experiments/node-library/metadata-fixtures.json

  package-platforms:
    name: Packaged Node runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build Companion package
        run: yarn package
      - name: Test setup, saved restart, cancellation and playback time
        run: node --test tests/session.test.mjs tests/node-setup.test.mjs tests/playback.test.mjs
      - name: Test the bundled module with package-only filesystem permissions
        run: yarn test:package

  validation-gate:
    name: validation-gate
    if: ${{ always() }}
    needs: [checks, package-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PACKAGE_RESULT: ${{ needs.package-platforms.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$PACKAGE_RESULT" = success
